# .air.toml
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -tags goolm -o ./tmp/main ./cmd/mautrix-mattermost"
# bin = "./tmp/main" # Deprecated
full_bin = "./tmp/main -c config.yaml -r registration.yaml"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor"]
include_dir = []
exclude_file = []
delay = 1000 # ms
stop_on_error = true
log = "air_errors.log"

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
