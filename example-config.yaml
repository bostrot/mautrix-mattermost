network:
    # Mattermost server URL and credentials are provided via the bridge login flow.
    # How Mattermost people are named in Matrix: their names and the text of
    # @mention pills. Mentions are always sent and matched by username.
    #   nickname  - nickname, then First Last, then username (default)
    #   username  - username (alice)
    #   full_name - First Last, falling back to username
    #   server    - as Mattermost shows them to you: your own display preference,
    #               else the server's "Teammate Name Display" setting
    # Changes apply to existing names at the next bridge restart.
    display_names: nickname
    # The MXC URI used as the Mattermost network icon: the avatar of your personal
    # Mattermost space in Matrix. Leave empty for none.
    space_avatar:
    # Poll for missed archive and restore events at this interval (e.g. 1m).
    # An empty string disables polling.
    # Use the final, non-redirecting server URL at login: safety probes refuse redirects.
    channel_poll_interval: ""
